name: LeadFinder regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 python-dotenv openai
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
